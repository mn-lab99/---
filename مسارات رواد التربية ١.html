<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>مسارات رواد التربية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@500;700;800&display=swap">
<style>

:root{
  --font-display:"Noto Kufi Arabic","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --font-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --navy:#1b265f; --navy-soft:#3a4b9a; --navy-deep:#0f3b92; --blue:#0d81d0; --blue-ink:#0b6db3; --blue-soft:#e6f2fc;
  --bg:#f3f8fc; --paper:#fff; --paper-2:#f1f6fc; --ink:#14224f; --muted:#5b6a8c;
  --line:#e2eaf5; --line-strong:#c4d3ea;
  --green:#1f8f5f; --green-soft:#e2f4ec; --amber:#8f5a00; --amber-soft:#fdf0d5; --rose:#b0414f; --rose-soft:#fae4e7; --gold:#b9822c;
  --shadow:0 12px 32px rgba(20,50,110,.08); --shadow-sm:0 4px 14px rgba(20,50,110,.07); --scrim:rgba(15,25,70,.42);
  --gl:max(20px,env(safe-area-inset-left,0px)); --gr:max(20px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html:has(dialog[open]){overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.7;min-height:100dvh}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
h1,h2,h3,h4{font-family:var(--font-display);text-wrap:balance;line-height:1.4;color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-ink)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
[dir="ltr"]{unicode-bidi:plaintext}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hint{font-size:.82rem;color:var(--muted)}
.vr{width:1px;height:30px;background:var(--line-strong);flex:none}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;box-shadow:var(--shadow-sm);flex:none}
.icon-btn svg{width:21px;height:21px;stroke:var(--navy);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.topbar{display:flex;align-items:center;gap:26px;min-height:76px;background:#fff;padding:10px var(--gr) 10px var(--gl);border-bottom:1px solid var(--line)}
.brand{display:block;flex:none}
.brand img{display:block;height:50px;width:auto;aspect-ratio:1024/274}
.mainnav{display:flex;align-items:center;gap:6px}
.mainnav a{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:0 16px;border-radius:12px;color:var(--navy);font-weight:600;text-decoration:none}
.mainnav a[aria-current="page"]{color:var(--blue-ink);background:var(--blue-soft)}
.topbar .icon-btn{margin-inline-start:auto}

/* navy band */
.band{position:relative;overflow:hidden;background:linear-gradient(90deg,#16215a 0%,#1b265f 55%,#1b3270 100%);color:#fff}
.band-in{position:relative;z-index:1;display:flex;align-items:center;gap:18px 22px;min-height:104px;padding:14px var(--gr) 14px var(--gl)}
.btn-add{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 24px;border-radius:999px;border:2px solid #177dc8;background:rgba(13,129,208,.1);color:#fff;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-add:hover{background:rgba(13,129,208,.3)}
.band .vr{background:rgba(255,255,255,.25);height:38px}
.stages{display:inline-flex;padding:5px;border-radius:999px;background:#333d6e}
.stages button{height:44px;padding:0 26px;border-radius:999px;border:0;background:transparent;color:#dbe4ff;font-weight:600;cursor:pointer}
.stages button[aria-pressed="true"]{background:var(--blue);color:#fff;box-shadow:0 6px 18px rgba(13,129,208,.45)}
.brandtitle{margin-inline-start:auto;padding-left:clamp(0px,6vw,120px);position:relative;z-index:1}
.brandtitle h1{font-size:clamp(2.2rem,4.4vw,3.4rem);font-weight:800;line-height:1.05;color:#fff}
.brandtitle p{font-family:var(--font-display);font-weight:700;font-size:clamp(1.1rem,2vw,1.6rem);color:#3da0ee;line-height:1.2;margin-top:2px;margin-inline-start:.3em}
.swoosh{position:absolute;left:0;top:0;height:100%;width:auto;max-width:42%;pointer-events:none;opacity:.9}
.band-home .band-in{min-height:200px;padding-block:34px}
.band-home .brandtitle{margin-inline-start:0;padding-left:0}
.band-home .brandtitle h1{font-size:clamp(3rem,7vw,5.2rem)}
.band-home .brandtitle p{font-size:clamp(1.4rem,3vw,2.2rem)}
.home-lead{margin-inline-start:auto;display:grid;gap:16px;justify-items:start;max-width:420px;padding-left:clamp(0px,5vw,80px);position:relative;z-index:1}
.home-lead p{color:#dbe4ff;font-size:1.1rem;line-height:1.9}
.btn-cta{display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 28px;border-radius:999px;background:var(--blue);color:#fff;font-weight:700;text-decoration:none;box-shadow:0 12px 26px rgba(13,129,208,.35)}
.btn-cta:hover{background:#0b72ba}
.btn-cta.dark{background:var(--navy);box-shadow:0 12px 26px rgba(27,38,95,.25)}

/* picker */
.picker{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;padding:12px var(--gr) 12px var(--gl);background:#fff;border-bottom:1px solid var(--line)}
.pk{display:flex;align-items:center;gap:10px;min-width:0}
.pk label{font-size:.9rem;color:var(--navy);font-weight:700;white-space:nowrap}
.pk select{min-width:230px;max-width:100%;height:46px;border:1px solid var(--line-strong);border-radius:14px;padding:0 12px;background:#fff;font-weight:600;color:var(--navy);cursor:pointer}
.pk .none{height:46px;display:inline-flex;align-items:center;color:var(--muted)}
.pk-actions{margin-inline-start:auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn-sm{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line-strong);background:#fff;color:var(--navy);font-weight:600;cursor:pointer;text-decoration:none;font-size:.92rem;line-height:1.2}
.btn-sm:hover{border-color:var(--navy)}
.btn-sm.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-sm.primary:hover{background:#0b72ba}
.btn-sm.danger{color:var(--rose);border-color:var(--rose)}
.btn-sm[disabled]{opacity:.4;cursor:default}
details.more{position:relative}
details.more>summary{list-style:none;cursor:pointer}
details.more>summary::-webkit-details-marker{display:none}
.menu{position:absolute;z-index:8;inset-inline-start:0;top:calc(100% + 6px);min-width:230px;display:grid;padding:6px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.menu button{border:0;background:transparent;text-align:start;min-height:42px;padding:0 14px;border-radius:10px;cursor:pointer;font-weight:500}
.menu button:hover{background:var(--paper-2)}
.menu .danger{color:var(--rose)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.demo-note{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;margin:16px var(--gr) 0 var(--gl);padding:10px 16px;border-radius:14px;background:var(--amber-soft);color:var(--amber);font-size:.9rem}
.demo-note button{min-height:36px;padding:0 14px;font-size:.86rem;background:transparent;color:inherit;border:1px solid currentColor;border-radius:12px;cursor:pointer;font-weight:600}

/* workspace */
.workspace{display:grid;grid-template-columns:minmax(300px,28fr) minmax(0,72fr);gap:24px;padding:22px var(--gr) 44px var(--gl);max-width:1720px;margin-inline:auto;align-items:start}
.workspace.single{grid-template-columns:1fr}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.mapcard{overflow:hidden}
.maphead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px 24px;flex-wrap:wrap;padding:18px 26px 4px}
.maphead h2{display:flex;gap:10px;align-items:center;font-size:1.5rem;font-weight:800;color:var(--navy)}
.maphead h2 .ic{width:26px;height:26px;color:var(--blue)}
.maphead .sub{color:var(--muted);margin-top:2px}
.maphead .sub b{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:4px;font-size:.88rem;color:var(--muted)}
.legend li{display:inline-flex;align-items:center;gap:7px}
.k{display:inline-block;width:14px;height:14px;border-radius:50%}
.k.done{background:#27a56a}.k.cur{background:var(--blue);box-shadow:0 0 0 4px rgba(13,129,208,.2)}.k.next{border:2px solid #8ea6cf;background:#fff}
.weektool{display:grid;gap:8px;min-width:0;max-width:420px}
.wk-nav{display:flex;align-items:center;gap:8px}
.iconb{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;border:1px solid var(--line-strong);background:#fff;color:var(--navy);cursor:pointer;flex:none}
.iconb[disabled]{opacity:.35;cursor:default}
.wk-lab{display:grid;line-height:1.3;min-width:130px;text-align:center}
.wk-lab small{color:var(--muted);font-size:.78rem}
.wk-items{display:flex;flex-wrap:wrap;gap:6px}
.wk-chip{border:0;background:var(--blue-soft);color:var(--blue-ink);border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:600;cursor:pointer}
.wk-none{font-size:.82rem;color:var(--muted)}
.summary{margin:8px 26px 0;padding:10px 16px;border-radius:14px;background:#f1f7fe;display:grid;gap:8px}
.sum-txt{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.sum-txt b{font-family:var(--font-display);font-size:1.1rem;color:var(--navy);display:inline-flex;align-items:center;gap:8px}
.sum-txt span{color:var(--muted);font-size:.92rem}
.bar{height:10px;border-radius:6px;background:#dbe6f6;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#0d81d0,#27a56a)}
.summary.complete{background:var(--green-soft)}
.summary.complete .sum-txt b{color:var(--green)}

.mapbox{position:relative;width:100%;margin-top:10px;overflow:hidden;background:#eef4fc}
.bgart,.roadsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stn{position:absolute;width:var(--orb);height:var(--orb);transform:translate(-50%,-50%);padding:0;border:0;background:none;overflow:visible;cursor:pointer;color:inherit;font:inherit;--orb:76px}
div.stn{cursor:default}
.stn .orb{position:absolute;inset:0;border-radius:50%;background:#fff;border:4px solid #fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(20,60,130,.2);color:#4a6aa0;transition:transform .15s}
.stn .orb .ic{width:36px;height:36px;stroke-width:1.7}
.stn.done .orb{color:#14917d}
.stn.cur .orb{background:radial-gradient(circle at 35% 30%,#2b9bf5,#0a73d8);color:#fff;box-shadow:0 0 0 9px rgba(13,129,208,.18),0 0 36px rgba(13,129,208,.55)}
.stn.next .orb{border-color:#c9d8ee;box-shadow:0 6px 16px rgba(20,60,130,.12)}
.stn.cancelled .orb{opacity:.5;filter:grayscale(1)}
.stn.postponed .orb{border:4px dashed #d8a73b}
.stn.sel .orb{outline:3px solid var(--navy);outline-offset:6px}
button.stn:hover .orb{transform:scale(1.06)}
.stn:focus-visible{outline:none}
.stn:focus-visible .orb{outline:3px solid var(--blue);outline-offset:6px}
.tick{position:absolute;right:-5px;top:-5px;width:28px;height:28px;border-radius:50%;background:#27a56a;border:3px solid #fff;display:grid;place-items:center}
.tick .ic{width:16px;height:16px;stroke:#fff;stroke-width:3}
.stn .lab{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);width:156px;text-align:center;display:grid;line-height:1.4;padding:3px 6px;border-radius:12px;background:rgba(255,255,255,.7)}
.lab .num{font-family:var(--font-display);font-weight:800;font-size:1.15rem;color:var(--navy)}
.lab .nm{font-weight:700;font-size:.95rem;color:var(--ink);overflow-wrap:anywhere}
.lab .dt{font-size:.78rem;color:var(--muted)}
.lab .dt.now{color:var(--blue-ink);font-weight:700}
.stn.cur .lab .num{color:var(--blue-ink)}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:12px 20px 0}
.pg-lab{font-size:.88rem;color:var(--muted)}
.mapfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 26px 18px}
.trackswitch{display:inline-flex;padding:5px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.trackswitch button{height:46px;padding:0 24px;border-radius:999px;border:0;background:transparent;color:var(--navy);font-weight:700;display:inline-flex;gap:9px;align-items:center;cursor:pointer}
.trackswitch button[aria-pressed="true"]{background:var(--navy-deep);color:#fff}
.empty.inmap{margin:20px 26px}
.empty-act{margin-top:14px}
.empty.big{margin:0;border:0;border-radius:0;padding:70px 20px 40px;background:transparent}

/* details panel */
.details{padding:22px;display:grid;gap:16px}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dhead h2{display:flex;align-items:center;gap:10px;font-size:1.2rem;font-weight:800;color:var(--navy)}
.dhead h2 .ic{color:var(--blue);width:22px;height:22px}
.dprog{display:flex;align-items:center;gap:14px}
.pico{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--blue-soft);color:var(--blue);flex:none}
.pico .ic{width:32px;height:32px}
.dprog h3{font-size:1.35rem;font-weight:800;color:var(--navy)}
.chip.trk{background:var(--blue-soft);color:var(--blue-ink)}
.dstep{background:#f4f8fd;border-radius:16px;padding:12px 16px;display:grid;gap:2px}
.dstep small{color:var(--muted)}
.dstep b{font-family:var(--font-display);font-size:1.05rem}
.dstep p{color:var(--ink);font-size:.95rem;margin-top:4px;line-height:1.8}
.dfacts{display:grid;gap:12px;padding-block:6px;border-block:1px solid var(--line)}
.dfacts li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:start}
.dfacts .ic{color:var(--navy);margin-top:3px}
.dfacts small{display:block;color:var(--muted);font-size:.78rem;line-height:1.4}
.dfacts li>span{font-weight:600;line-height:1.5}
.dactions{display:grid;gap:10px}
.act{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border-radius:14px;border:1.5px solid #177dc8;background:#fff;color:var(--blue-ink);font-weight:700;font-size:1rem;cursor:pointer;list-style:none}
.act.primary{background:#1b7ec6;border-color:#1b7ec6;color:#fff;box-shadow:0 10px 22px rgba(27,126,198,.28)}
.act:hover{filter:brightness(.97)}
.dactions details.more>summary{border-color:var(--line-strong);color:var(--navy)}
.dactions .menu{position:static;box-shadow:none;margin-top:8px;border-color:var(--line)}
.vcard{background:#eaf3fd;border-radius:18px;padding:14px;display:grid;gap:10px}
.vcard h3{display:flex;align-items:center;gap:8px;font-size:1rem;color:var(--navy)}
.vcard .qrblock{background:#fff}

/* home */
.home-body{max-width:1180px;margin:0 auto;padding:26px var(--gr) 50px var(--gl);display:grid;gap:22px}
.card-h{padding:22px 26px 0}
.card-h h2{display:flex;gap:10px;align-items:center;font-size:1.4rem;font-weight:800;color:var(--navy)}
.card-h h2 .ic{color:var(--blue);width:24px;height:24px}
.card-h .sub{color:var(--muted)}
.home-road{overflow:hidden;padding-bottom:0}
.two-tracks{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.trk{padding:24px;display:grid;gap:10px;justify-items:start}
.trk h3{font-size:1.25rem;color:var(--navy)}
.trk p{color:var(--muted)}
.ticon{display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:var(--blue-soft);color:var(--blue)}
.t-app .ticon{background:#dff3ee;color:#14917d}
.ticon .ic{width:28px;height:28px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.facts li{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 18px;display:grid;gap:2px;box-shadow:var(--shadow-sm)}
.facts b{font-family:var(--font-display);color:var(--navy)}
.facts span{color:var(--muted);font-size:.9rem}
.cta-end{display:flex;justify-content:center}

/* library / steps / team panels */
.libtools{display:grid;gap:10px;margin-bottom:6px}
.libtools input[type=search]{width:100%;min-height:46px;padding:8px 14px;border:1px solid var(--line-strong);border-radius:12px;background:#fff}
.libtools select{width:100%;min-height:46px;padding:8px 14px;border:1px solid var(--line-strong);border-radius:12px;background:#fff}
.litems{display:grid;gap:14px}
.litem{border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:8px;background:#fff}
.litem .grp{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;color:#14917d}
.litem.t-vis .grp{color:var(--blue-ink)}
.litem .grp i{width:9px;height:9px;border-radius:50%;background:currentColor}
.litem h4{font-size:1.1rem}
.litem .v{color:var(--muted);font-size:.92rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.steplist{display:grid;gap:8px}
.steprow,.trow{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:#fff}
.trow{grid-template-columns:minmax(0,1fr) auto}
.sn{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--blue-soft);color:var(--blue-ink);font-weight:700;font-size:.85rem}
.sm b{display:block;overflow-wrap:anywhere}
.sm small,.trow small{display:block;color:var(--muted)}
.sa{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.trows{display:grid;gap:8px}
.tteam{display:grid;gap:8px}
.tteam h3{font-size:1.05rem;color:var(--navy)}
.tteam ul{display:grid;gap:8px}
.tteam li button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;width:100%;text-align:start;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer}
.tteam li button:hover{border-color:var(--blue)}
.tteam .tn small{display:block;color:var(--muted)}
.tteam .bar{grid-column:1/-1}
.tteam .tp{font-weight:700;color:var(--navy)}

/* responsive */
@media (max-width:1100px){.workspace{grid-template-columns:minmax(280px,34fr) minmax(0,66fr)}}
@media (max-width:900px){
  .topbar{gap:12px;flex-wrap:wrap}
  .band-in{flex-wrap:wrap;padding-block:14px;gap:12px}
  .brandtitle{order:-1;width:100%;margin:0;padding-left:0;display:flex;align-items:baseline;gap:12px}
  .brandtitle p{margin:0}
  .swoosh{max-width:60%;opacity:.5}
  .btn-add{height:46px;padding:0 18px}
  .band .vr{display:none}
  .stages{flex:1}
  .stages button{flex:1;padding:0 8px;height:42px}
  .band-home .band-in{flex-direction:column;align-items:flex-start;padding-block:26px}
  .home-lead{margin:0;padding-left:0;max-width:none}
  .picker .pk{flex:1 1 100%;display:grid;gap:4px}
  .pk label{font-size:.78rem;color:var(--muted)}
  .pk select{width:100%;min-width:0}
  .pk-actions{margin:0;width:100%}
  .pk-actions>.btn-sm{flex:1 1 auto}
  .workspace{grid-template-columns:1fr;padding-top:16px;gap:16px}
  .mapcard{order:1}.details{order:2}
  .maphead{padding:18px 16px 4px}
  .summary{margin:10px 16px 0}
  .weektool{max-width:none;width:100%}
  .mapfoot{padding:14px 16px 18px}
  .trackswitch{width:100%}.trackswitch button{flex:1;padding:0 8px;justify-content:center}

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {

    var done = false;
    var f = openPanel(mid, o.title, '<p>' + esc(o.text) + '</p>', '<button class="btn" type="button" data-act="c-no">' + esc(o.no || 'تراجع') + '</button><button class="btn ' + (o.danger ? 'btn-danger' : 'btn-primary') + '" type="submit">' + esc(o.ok) + '</button>', {
      onSubmit: function () { done = true; closePanel(mid); resolve(true); }
    });
    $('[data-act="c-no"]', f).addEventListener('click', function () { closePanel(mid); });
    mid.addEventListener('close', function h() { mid.removeEventListener('close', h); if (!done) resolve(false); });

/* form builders */
function fld(id, label, control, hint, optional) {
  return '<div class="fld"><label for="' + id + '">' + label + (optional ? ' <span class="opt">(اختياري)</span>' : '') + '</label>' + control + (hint ? '<span class="hint">' + hint + '</span>' : '') + '<p class="err" id="e-' + id + '" aria-live="polite"></p></div>';
}
function opts(list, cur) { return list.map(function (o) { return '<option value="' + esc(o) + '"' + (o === cur ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join(''); }
function setErr(form, id, msg) {
  var e = $('#e-' + id, form), c = $('#' + id, form);
  if (e) e.textContent = msg || '';

}
function dateHint(form) {
  var v = $('#f-date', form).value, h = $('#h-date', form);
  if (!v) { h.textContent = ''; return; }

  h.textContent = (dow === 5 || dow === 6) ? 'هذا اليوم ضمن عطلة نهاية الأسبوع.' : DAYS[dow];
}
function shiftWeekend(s) { var d = parseD(s).getDay(); return d === 5 ? addDays(s, 2) : d === 6 ? addDays(s, 1) : s; }
function curAsg() { return Repo.asg(ui.asg); }
function focusCurrent() { ui.sel = ''; ui.part = null; }

function wireProgramForm(form) {

function readProgram(form, existing) {
  var fd = new FormData(form), ok = true, first = null;
  var fail = function (id, msg) { setErr(form, id, msg); if (!first) first = id; ok = false; };
  ['f-title', 'f-value', 'f-source', 'stages'].forEach(function (i) { setErr(form, i, ''); });
  var track = fd.get('track') === 'visual' ? 'visual' : 'practical';
  var title = String(fd.get('title') || '').trim(), value = String(fd.get('value') || '').trim(), source = String(fd.get('source') || '').trim();
  var stages = fd.getAll('stages').filter(function (s) { return STAGES.indexOf(s) > -1; });
  if (!title) fail('f-title', 'اكتب اسم البرنامج.');
  if (track === 'practical' && !value) fail('f-value', 'اكتب القيمة المستهدفة.');
  if (track === 'practical' && !stages.length) fail('stages', 'اختر مرحلة واحدة على الأقل.');
  if (source && !isWeb(source)) fail('f-source', 'اكتب رابطًا صحيحًا يبدأ بـ https://');
  if (!ok) { var el = $('#' + (first === 'stages' ? 'l-stages' : first), form); if (el) el.scrollIntoView({ block: 'center' }); var inp = $('#' + first, form); if (inp) inp.focus(); return null; }
  var p = existing || { id: uid('p'), builtin: false, actions: [], act: null, observe: null, clips: null, note: '', steps: [] };
  p.title = title; p.desc = String(fd.get('desc') || '').trim(); p.value = value; p.track = track;
  p.group = track === 'visual' ? VISUAL_GROUP : String(fd.get('group') || GROUPS[4]); p.stages = stages; p.source = source; p.review = fd.get('review') === 'ok' ? 'ok' : 'pending';
  if (!existing) {
    var lines = String(fd.get('steps') || '').split('\n').map(function (l) { return l.trim(); }).filter(Boolean).slice(0, 60);
    p.steps = lines.length ? lines.map(function (l) { return mkStep(track === 'visual' ? 'clip' : 'activity', l.slice(0, 80)); }) : [mkStep(track === 'visual' ? 'clip' : 'meeting', track === 'visual' ? 'المقطع 1' : 'اللقاء')];
  }
  return p;
}

function wireAssign(f) {
  var sync = function () { $('#newt-wrap', f).hidden = $('#f-teacher', f).value !== '__new'; };
  $('#f-teacher', f).addEventListener('change', sync); sync();
  $('#f-date', f).addEventListener('change', function () { dateHint(f); });
  var pr = $('#f-program', f);
  if (pr) pr.addEventListener('change', function () { var p = Repo.prog(pr.value); if (p && p.stages.length === 1 && !$('#f-stage', f).value) $('#f-stage', f).value = p.stages[0]; });
}
function readAssign(f, prog) {
  var fd = new FormData(f), ok = true, first = null;
  var fail = function (id, msg) { setErr(f, id, msg); if (!first) first = id; ok = false; };
  ['f-teacher', 'f-newteacher', 'f-stage', 'f-program'].forEach(function (i) { setErr(f, i, ''); });
  var tv = String(fd.get('teacher') || ''), nt = String(fd.get('newteacher') || '').trim(), stage = String(fd.get('stage') || ''), label = String(fd.get('label') || '').trim();
  if (!prog) fail('f-program', 'اختر البرنامج.');
  if (!tv) fail('f-teacher', 'اختر المعلم.');
  if (tv === '__new' && !nt) fail('f-newteacher', 'اكتب اسم المعلم.');
  if (tv === '__new' && db.teachers.some(function (t) { return t.name === nt; })) fail('f-newteacher', 'هذا الاسم موجود. اخترْه من القائمة.');
  if (!stage) fail('f-stage', 'اختر المرحلة.');
  if (ok && tv !== '__new' && db.assignments.some(function (a) { return a.teacherId === tv && a.programId === prog.id && a.stage === stage && a.label === label; })) fail('f-stage', 'هذا البرنامج مسند للمعلم في هذه المرحلة بالفعل. اخترْه من قائمة البرامج، أو غيّر المرحلة أو المجموعة.');
  if (!ok) { var inp = $('#' + first, f); if (inp) { inp.scrollIntoView({ block: 'center' }); inp.focus(); } return null; }
  var teacherId = tv;
  if (tv === '__new') { var t = { id: uid('u'), name: nt, demo: false }; db.teachers.push(t); teacherId = t.id; }
  var a = { id: uid('a'), teacherId: teacherId, programId: prog.id, stage: stage, label: label, demo: false, rec: {} };
  var date = String(fd.get('date') || ''), per = fd.get('period'), start = String(fd.get('start') || ''), dur = parseInt(fd.get('duration'), 10) || 30, cad = fd.get('cadence');
  if (date) {
    var d = date;
    prog.steps.forEach(function (s, i) {
      if (i > 0 && cad === 'first') return;
      var r = newRec(); r.date = d; r.period = PERIODS.indexOf(per) > -1 ? per : PERIODS[0]; r.start = start; r.duration = dur; a.rec[s.id] = r;
      d = cad === 'daily' ? shiftWeekend(addDays(d, 1)) : addDays(d, 7);
    });
  }
  return a;
}
function afterAssign(a) {

    '<div class="fld"><label for="i-file">ملف الخطة</label><input type="file" id="i-file" accept=".json,application/json"></div>' +

    '<button class="btn" type="button" data-act="import-go">استيراد</button></fieldset>' +
    '<fieldset><legend>إعادة الضبط</legend><button class="btn btn-danger" type="button" data-act="reset-all">استعادة المحتوى الأصلي والخطة التجريبية</button></fieldset>';
  openPanel(drawer, 'الإعدادات', body, '<button class="btn" type="button" data-act="close">إغلاق</button>', {
    onReady: function (f) {
      var json = JSON.stringify({ app: 'masarat', version: 2, exportedAt: new Date().toISOString(), programs: db.programs, teachers: db.teachers, assignments: db.assignments }, null, 2);
      var ta = $('#x-json', f); if (ta) ta.value = json;
      $('#i-file', f).addEventListener('change', function (e) {
        var file = e.target.files && e.target.files[0]; if (!file) return;
        var r = new FileReader(); r.onload = function () { $('#i-text', f).value = String(r.result || ''); }; r.readAsText(file);
      });
      f._json = json;
    }
  });
}
function doImport(f) {
  var txt = $('#i-text', f).value.trim(), err = $('#e-i-text', f); err.textContent = '';
  if (!txt) { err.textContent = 'اختر ملفًا أو الصق نص الخطة.'; return; }
  var data; try { data = sanitize(JSON.parse(txt)); } catch (e) { data = null; }
  if (!data) { err.textContent = 'تعذر قراءة الخطة. تأكد أنها نسخة مصدّرة من مسارات.'; return; }
  confirmDlg({ title: 'استيراد الخطة', text: 'سيحل المحتوى المستورد (' + data.programs.length + ' برنامجًا و' + data.teachers.length + ' معلمًا و' + data.assignments.length + ' إسنادًا) محل البيانات الحالية على هذا الجهاز.', ok: 'استيراد', danger: true }).then(function (y) {
    if (!y) return; db = data; ui.asg = ''; ui.teacher = ''; focusCurrent(); commit(); closePanel(drawer); ensureSel(); render(); toast('تم استيراد الخطة');
  });
}

/* ============ admin: gate, schedule, teacher programs ============ */
function admOK() { if (ui.adm) return true; try { return sessionStorage.getItem('masarat.adm') === '1'; } catch (e) { return false; } }
function normDigits(s) { return String(s || '').replace(/[٠-٩]/g, function (c) { return String(c.charCodeAt(0) - 1632); }).replace(/[۰-۹]/g, function (c) { return String(c.charCodeAt(0) - 1776); }).trim(); }
function gate() {
  var ok = false;
  var f = openPanel(mid, 'إدارة المنصة', '<p class="hint">أدخل الرمز السري للدخول.</p>' + fld('g-code', 'الرمز', '<input type="password" id="g-code" name="code" dir="ltr" autocomplete="off">'),
    '<button class="btn" type="button" data-act="close">إلغاء</button><button class="btn btn-primary" type="submit">دخول</button>', {
      onSubmit: function (f) {
        setErr(f, 'g-code', '');
        if (normDigits($('#g-code', f).value) !== '000') { setErr(f, 'g-code', 'الرمز غير صحيح.'); $('#g-code', f).select(); return; }
        ok = true; ui.adm = true; try { sessionStorage.setItem('masarat.adm', '1'); } catch (e) {}
        closePanel(mid); ui.page = 'admin'; render(); window.scrollTo(0, 0);
      }
    });
  var h = function () { mid.removeEventListener('close', h); if (!ok) location.hash = '#plan'; };
  mid.addEventListener('close', h);
  setTimeout(function () { var i = $('#g-code', f); if (i) i.focus(); }, 60);
}
function panelSchedule(pid) {
  var p0 = pid ? Repo.prog(pid) : null;
  var vcur = p0 && p0.track === 'visual' ? p0.id : '', pcur = p0 && p0.track === 'practical' ? p0.id : '';
  if (vcur === 'v_prayer') pcur = 'prayer'; if (pcur === 'prayer') vcur = 'v_prayer';
  var sel = function (id, tr, cur) {
    return '<select id="' + id + '" name="' + id + '"><option value="">بدون</option>' + db.programs.filter(function (p) { return p.track === tr; }).map(function (p) { return '<option value="' + p.id + '"' + (p.id === cur ? ' selected' : '') + '>' + esc(p.title) + '</option>'; }).join('') + '</select>';
  };
  var base = (p0 && p0.stages.length) ? p0.stages : ['ابتدائي'];
  var stages = STAGES.map(function (s) { return '<label><input type="checkbox" name="stages" value="' + s + '"' + (base.indexOf(s) > -1 ? ' checked' : '') + '>' + s + '</label>'; }).join('');
  openPanel(drawer, 'جدولة أسبوع جديد',
    '<p class="hint">الأسبوع الأول للمسار المرئي، والأسبوع الذي يليه للمسار التطبيقي. يظهر البرنامج للمعلمين تلقائيًا في أسبوعه ويُغلق بعده.</p>' +
    fld('s-v', 'البرنامج المرئي (الأسبوع الأول)', sel('s-v', 'visual', vcur), '', true) + fld('s-p', 'البرنامج التطبيقي (الأسبوع الثاني)', sel('s-p', 'practical', pcur), '', true) +
    fld('s-date', 'يبدأ في أسبوع', '<input type="date" id="s-date" name="date" value="' + addDays(weekStart(todayISO()), 7) + '">', 'اختر أي يوم من الأسبوع، ويبدأ الأسبوع من الأحد.') +
    '<div class="fld"><span class="lab" id="l-s-st">المراحل</span><div class="choices" role="group" aria-labelledby="l-s-st">' + stages + '</div><p class="err" id="e-s-st" aria-live="polite"></p></div>',
    '<button class="btn" type="button" data-act="close">إلغاء</button><button class="btn btn-primary" type="submit">جدولة</button>', {
      onSubmit: function (f) {
        setErr(f, 's-v', ''); setErr(f, 's-date', ''); var se = $('#e-s-st', f); se.textContent = '';
        var vp = Repo.prog($('#s-v', f).value), pp = Repo.prog($('#s-p', f).value), d = $('#s-date', f).value, st = new FormData(f).getAll('stages');
        if (!vp && !pp) { setErr(f, 's-v', 'اختر برنامجًا مرئيًا أو تطبيقيًا على الأقل.'); return; }
        if (!d) { setErr(f, 's-date', 'اختر الأسبوع.'); return; }
        if (!st.length) { se.textContent = 'اختر مرحلة واحدة على الأقل.'; return; }
        var ws = weekStart(d), off = vp ? 7 : 0;
        if (vp) { vp.open = 'auto'; vp.from = ws; vp.to = addDays(ws, 6); vp.stages = st.slice(); }
        if (pp) { pp.open = 'auto'; pp.from = addDays(ws, off); pp.to = addDays(ws, off + 6); pp.stages = st.slice(); }
        commit(); closePanel(drawer); render();
        toast((vp ? 'المرئي من ' + fmtShort(vp.from) : '') + (vp && pp ? ' والتطبيقي من ' + fmtShort(pp.from) : pp ? 'التطبيقي من ' + fmtShort(pp.from) : ''));
      }
    });
}
function panelTeacherProgs(tid) {
  var t = Repo.teacher(tid); if (!t) return; var ex = t.extra || [];
  var o = function (cur) { return '<option value="">بدون</option>' + db.programs.map(function (p) { return '<option value="' + p.id + '"' + (p.id === cur ? ' selected' : '') + '>' + esc(p.title) + ' (' + (p.track === 'visual' ? 'مرئي' : 'تطبيقي') + ')</option>'; }).join(''); };
  openPanel(mid, 'برامج إضافية: ' + t.name, '<p class="hint">تظهر هذه البرامج لهذا المعلم وحده، إضافةً إلى البرامج المفتوحة للجميع. الحد الأقصى برنامجان.</p>' +
    fld('x1', 'البرنامج الأول', '<select id="x1" name="x1">' + o(ex[0]) + '</select>', '', true) + fld('x2', 'البرنامج الثاني', '<select id="x2" name="x2">' + o(ex[1]) + '</select>', '', true),
    '<button class="btn" type="button" data-act="close">إلغاء</button><button class="btn btn-primary" type="submit">حفظ</button>', {
      onSubmit: function (f) {
        var a = $('#x1', f).value, b = $('#x2', f).value, arr = []; if (a) arr.push(a); if (b && b !== a) arr.push(b);
        t.extra = arr; commit(); closePanel(mid); render(); toast('تم الحفظ');
      }
    });
}

/* ============ events ============ */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el) return;
  var a = el.getAttribute('data-act'), id = el.getAttribute('data-id'), v = el.getAttribute('data-v');
  var dm = el.closest('details.more'); if (dm) dm.open = false;
  switch (a) {
    case 'close': { var dl = el.closest('dialog'); if (dl && dl.open) dl.close(); break; }
    case 'settings': panelSettings(); break;
    case 'add-prog': panelAddProg(); break;
    case 'adm-sched': panelSchedule(id); break;
    case 'adm-tprog': panelTeacherProgs(id); break;
    case 'adm-stage': {
      var sp = Repo.prog(id); if (!sp) break;
      var cur = sp.stages.length ? sp.stages.slice() : STAGES.slice(), k = cur.indexOf(v);
      if (k > -1) cur.splice(k, 1); else cur.push(v);
      sp.stages = STAGES.filter(function (x) { return cur.indexOf(x) > -1; }); commit(); render(); break;
    }
    case 'adm-reset':
      confirmDlg({ title: 'تصفير تقدم الجميع', text: 'سيُمسح كل التوثيق والتقدم لكل المعلمين في كل البرامج، ولا يمكن التراجع عن ذلك. البرامج والفصول والجدولة تبقى كما هي.', ok: 'تصفير الكل', danger: true }).then(function (y) {
        if (!y) return; db.assignments.forEach(function (x) { x.rec = {}; }); ui.sel = ''; ui.part = null; commit(); render(); toast('تم تصفير تقدم جميع البرامج');
      }); break;
    case 'adm-lock': ui.adm = false; try { sessionStorage.removeItem('masarat.adm'); } catch (e) {} location.hash = '#plan'; break;
    case 'assign': panelAssign(null); break;
    case 'assign-prog': panelAssign(id); break;
    case 'library': panelLibrary(); break;
    case 'lib-track': lib.track = v; $$('[data-act="lib-track"]', drawer).forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === v)); }); $('#lib-list', drawer).innerHTML = libList(); break;
    case 'team': panelTeam(); break;
    case 'team-open': { var ta = Repo.asg(id); if (ta) { ui.teacher = ta.teacherId; ui.stage = 'all'; ui.prog = ''; ui.track = Repo.prog(ta.programId).track; ui.asg = id; focusCurrent(); closePanel(drawer); if (ui.page !== 'plan') location.hash = 'plan'; else render(); } break; }
    case 'teachers': panelTeachers(); break;
    case 'teacher-edit': panelTeacherEdit(id); break;
    case 'teacher-del': doDelTeacher(id); break;
    case 'steps': panelSteps(id); break;
    case 'st-add': panelStepForm(id, null, 'steps'); break;
    case 'st-edit': panelStepForm(id, v, 'steps'); break;
    case 'st-up': moveStep(id, v, -1); break;
    case 'st-down': moveStep(id, v, 1); break;
    case 'st-del': doDelStep(id, v); break;
    case 'st-cancel': if (v === 'steps') panelSteps(id); else closePanel(drawer); break;
    case 'edit-step': { var ca = curAsg(); if (ca) panelStepForm(ca.programId, id, 'plan'); break; }
    case 'del-step': { var cb = curAsg(); if (cb) doDelStep(cb.programId, id); break; }
    case 'edit-prog': panelEditProg(id); break;
    case 'del-prog': doDelProg(id); break;
    case 'del-asg': doDelAsg(id); break;
    case 'cls': { var cp = v.split('|'); pickClass(cp[0], cp[1]); break; }
    case 'done': doQuick(id); break;
    case 'f-track': ui.track = v; ui.prog = ''; ui.asg = ''; ensureSel(); render(); break;
    case 'pick': ui.sel = id; render(); break;
    case 'week-prev': ui.week--; render(); break;
    case 'week-next': ui.week++; render(); break;
    case 'part-prev': { var b = curAsg(); if (b) { var P1 = progress(b), cur1 = ui.part == null ? Math.floor(selIndex(P1) / PER) : ui.part; ui.part = Math.max(0, cur1 - 1); render(); } break; }
    case 'part-next': { var c2 = curAsg(); if (c2) { var P2 = progress(c2), cur2 = ui.part == null ? Math.floor(selIndex(P2) / PER) : ui.part; ui.part = Math.min(Math.ceil(P2.total / PER) - 1, cur2 + 1); render(); } break; }
    case 'start': doStart(id); break;
    case 'doc': panelDoc(id); break;
    case 'sched': panelSched(id); break;
    case 'postpone': panelPostpone(id); break;
    case 'cancel': doCancel(id); break;
    case 'restore': doRestore(id); break;
    case 'undo': doUndo(id); break;
    case 'zoom': panelZoom(id); break;
    case 'clear-demo':
      confirmDlg({ title: 'البدء بخطة فارغة', text: 'ستُحذف الإسنادات والمعلمون التجريبيون، وتبقى مكتبة البرامج وما أضفته أنت كما هو.', ok: 'ابدأ بخطة فارغة', danger: true }).then(function (y) {
        if (!y) return; db.assignments = db.assignments.filter(function (x) { return !x.demo; }); db.teachers = db.teachers.filter(function (t) { return !t.demo; }); ui.asg = ''; ui.teacher = ''; focusCurrent(); commit(); ensureSel(); render(); toast('الخطة فارغة الآن');
      }); break;
    case 'export-file': {
      var f = el.closest('form'), data = f._json;
      saveFile('masarat-' + todayISO() + '.json', data).then(function () { toast('تم الحفظ'); }, function (er) { if (er && er.code !== 'declined') toast('تعذر الحفظ في هذا العرض'); });
      break; }
    case 'export-copy': { var xa = $('#x-json'); copyText(xa.value, xa); break; }
    case 'import-go': doImport(el.closest('form')); break;
    case 'reset-all':
      confirmDlg({ title: 'استعادة المحتوى الأصلي', text: 'ستُستبدل كل البرامج والمعلمين والتقدم الحاليين بالمحتوى الأصلي والخطة التجريبية.', ok: 'استعادة', danger: true }).then(function (y) {
        if (!y) return; db = freshData(); ui.asg = ''; ui.teacher = ''; ui.stage = 'all'; ui.prog = ''; focusCurrent(); commit(); closePanel(drawer); ensureSel(); render(); toast('تمت الاستعادة');
      }); break;
  }
});
document.addEventListener('change', function (e) {
  var inp = e.target.closest && e.target.closest('input[data-cn]');
  if (inp) { var cp = inp.getAttribute('data-cn').split('|'), cn = Math.min(9, Math.max(0, parseInt(inp.value, 10) || 0)); if (db.classes[cp[0]] && db.classes[cp[0]][+cp[1]]) { db.classes[cp[0]][+cp[1]][1] = cn; commit(); render(); toast('تم تحديث عدد الفصول'); } return; }
  var sl = e.target.closest && e.target.closest('select[data-sel]'); if (!sl) return;
  var n = sl.getAttribute('data-sel'), v = sl.value;
  if (n === 'mode') { var pm = Repo.prog(sl.getAttribute('data-id')); if (pm) { pm.open = v; commit(); } render(); return; }
  if (n === 'teacher') { ui.teacher = v; ui.asg = ''; try { localStorage.setItem('masarat.me', v); } catch (e) {} focusCurrent(); ensureSel(); }
  else if (n === 'prog') { ui.prog = v; ui.asg = ''; focusCurrent(); ensureSel(); }
  render();
});
document.addEventListener('click', function (e) {
  // close the actions menu when clicking elsewhere
  $$('details.more[open]').forEach(function (d) { if (!d.contains(e.target)) d.open = false; });
});

/* ============ boot ============ */
route();
})();


</script>

</body></html>
